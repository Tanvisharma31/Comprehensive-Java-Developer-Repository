server.port=8080

# Backup Storage
backup.storage.path=./backups

# Scheduled Backup Configuration
backup.schedule.enabled=false
backup.schedule.cron=0 0 2 * * ?  # Daily at 2 AM

# Database Configuration for Scheduled Backups
backup.schedule.database.type=POSTGRESQL
backup.schedule.database.host=localhost
backup.schedule.database.port=5432
backup.schedule.database.name=
backup.schedule.database.username=
backup.schedule.database.password=

# Application Database (H2 for metadata storage)
spring.datasource.url=jdbc:h2:mem:backupdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
