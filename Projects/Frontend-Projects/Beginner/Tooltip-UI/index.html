<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tooltip Examples</h1>
        
        <div class="tooltip-demo">
            <button class="tooltip-btn" data-tooltip="This is a top tooltip">
                Hover me (Top)
            </button>
            
            <button class="tooltip-btn" data-tooltip="This is a right tooltip" data-position="right">
                Hover me (Right)
            </button>
            
            <button class="tooltip-btn" data-tooltip="This is a bottom tooltip" data-position="bottom">
                Hover me (Bottom)
            </button>
            
            <button class="tooltip-btn" data-tooltip="This is a left tooltip" data-position="left">
                Hover me (Left)
            </button>
        </div>
        
        <div class="info">
            <p>Hover over the buttons to see tooltips in different positions.</p>
        </div>
    </div>
</body>
</html>
