<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Textarea with Character Count</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Restricted Textarea</h1>
        
        <form>
            <div class="form-group">
                <label for="message">Your Message <span class="char-count"><span id="current-count">0</span>/<span id="max-count">200</span></span></label>
                <textarea 
                    id="message" 
                    name="message" 
                    rows="6" 
                    maxlength="200"
                    placeholder="Type your message here (max 200 characters)..."></textarea>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
