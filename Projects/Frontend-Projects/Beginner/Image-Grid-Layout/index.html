<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Image Gallery</h1>
        
        <div class="image-grid">
            <div class="image-item">
                <img src="https://via.placeholder.com/400x300/667eea/ffffff?text=Image+1" alt="Gallery image 1">
                <div class="overlay">
                    <p>Beautiful Landscape</p>
                </div>
            </div>
            
            <div class="image-item">
                <img src="https://via.placeholder.com/400x300/764ba2/ffffff?text=Image+2" alt="Gallery image 2">
                <div class="overlay">
                    <p>City Skyline</p>
                </div>
            </div>
            
            <div class="image-item">
                <img src="https://via.placeholder.com/400x300/f093fb/ffffff?text=Image+3" alt="Gallery image 3">
                <div class="overlay">
                    <p>Nature Scene</p>
                </div>
            </div>
            
            <div class="image-item">
                <img src="https://via.placeholder.com/400x300/4facfe/ffffff?text=Image+4" alt="Gallery image 4">
                <div class="overlay">
                    <p>Ocean View</p>
                </div>
            </div>
            
            <div class="image-item">
                <img src="https://via.placeholder.com/400x300/43e97b/ffffff?text=Image+5" alt="Gallery image 5">
                <div class="overlay">
                    <p>Mountain Range</p>
                </div>
            </div>
            
            <div class="image-item">
                <img src="https://via.placeholder.com/400x300/fa709a/ffffff?text=Image+6" alt="Gallery image 6">
                <div class="overlay">
                    <p>Sunset</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
