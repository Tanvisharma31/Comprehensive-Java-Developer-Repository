<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tab Component</h1>
        
        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="tab1">Home</button>
                <button class="tab-btn" data-tab="tab2">About</button>
                <button class="tab-btn" data-tab="tab3">Services</button>
                <button class="tab-btn" data-tab="tab4">Contact</button>
            </div>
            
            <div class="tab-content">
                <div class="tab-panel active" id="tab1">
                    <h2>Home</h2>
                    <p>Welcome to our website! This is the home tab content.</p>
                </div>
                
                <div class="tab-panel" id="tab2">
                    <h2>About</h2>
                    <p>Learn more about us and our mission.</p>
                </div>
                
                <div class="tab-panel" id="tab3">
                    <h2>Services</h2>
                    <p>We offer a wide range of services to meet your needs.</p>
                </div>
                
                <div class="tab-panel" id="tab4">
                    <h2>Contact</h2>
                    <p>Get in touch with us through various channels.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
