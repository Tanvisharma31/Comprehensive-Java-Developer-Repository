<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Consent Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cookie Consent Example</h1>
        <p>This page demonstrates a cookie consent banner. Scroll down or refresh to see it.</p>
    </div>
    
    <div id="cookie-banner" class="cookie-banner">
        <div class="cookie-content">
            <div class="cookie-text">
                <h3>🍪 We use cookies</h3>
                <p>This website uses cookies to enhance your browsing experience and analyze site traffic.</p>
            </div>
            <div class="cookie-buttons">
                <button id="accept-cookies" class="btn-accept">Accept All</button>
                <button id="decline-cookies" class="btn-decline">Decline</button>
                <button id="customize-cookies" class="btn-customize">Customize</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
